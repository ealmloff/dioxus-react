[package]
name = "dioxus-react-bridge-types"
version = "0.1.0"
edition = "2024"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wry_bridge = { package = "wry-bridge", path = "../../crates/wry-bridge" }
wasm-bindgen = "0.2"
serde_json = "1"

[patch.crates-io]
wasm-bindgen = { git = "https://github.com/ealmloff/wasm-bindgen-wry-1.git", branch = "codex/typed-struct-export-fix", package = "wasm-bindgen" }
wasm-bindgen-macro = { git = "https://github.com/ealmloff/wasm-bindgen-wry-1.git", branch = "codex/typed-struct-export-fix", package = "wasm-bindgen-macro" }
