[package]
name = "wry-driver"
version = "0.1.0"
edition = "2024"

[dependencies]
wry-launch = { git = "https://github.com/ealmloff/wasm-bindgen-wry-1.git", branch = "codex/typed-struct-export-fix", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"
js-sys = "0.3"
wasm-bindgen = "0.2"

[dependencies.web-sys]
version = "0.3"
features = [
  "Document",
  "Element",
  "EventTarget",
  "HtmlElement",
  "HtmlHeadElement",
  "HtmlLinkElement",
  "HtmlScriptElement",
  "Node",
  "Window",
]
