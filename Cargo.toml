[package]
name = "dioxus-react"
version = "0.1.0"
edition = "2024"
description = "React + native Rust desktop app using wasm-bindgen-wry"
license = "MIT OR Apache-2.0"

[workspace]
members = [
    ".",
    "crates/wry-driver",
    "crates/wry-bridge",
]
exclude = ["scripts/bridge-types"]

[dependencies]
wry-driver = { path = "crates/wry-driver" }
wry-bridge = { path = "crates/wry-bridge" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"

[patch.crates-io]
wasm-bindgen = { git = "https://github.com/ealmloff/wasm-bindgen-wry-1.git", branch = "codex/typed-struct-export-fix", package = "wasm-bindgen" }
wasm-bindgen-macro = { git = "https://github.com/ealmloff/wasm-bindgen-wry-1.git", branch = "codex/typed-struct-export-fix", package = "wasm-bindgen-macro" }
